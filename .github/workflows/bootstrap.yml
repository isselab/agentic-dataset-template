name: Bootstrap dataset repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset-bootstrap
  cancel-in-progress: false

env:
  PARENT_REPOSITORY: isselab/agentic-feature-traced-datasets
  TEMPLATE_REPOSITORY: isselab/agentic-dataset-template

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bootstrap marker
        id: bootstrap
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" = "$TEMPLATE_REPOSITORY" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This is the template repository; bootstrap is disabled."
          elif [ -f .github/.bootstrap ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repository has already been bootstrapped."
          fi

      - name: Require parent token
        if: steps.bootstrap.outputs.required == 'true'
        env:
          PARENT_REPO_PAT: ${{ secrets.PARENT_REPO_PAT }}
        run: |
          if [ -z "$PARENT_REPO_PAT" ]; then
            echo "::error::PARENT_REPO_PAT is unavailable. Add it, then rerun this workflow."
            exit 1
          fi

      - name: Customize generated repository
        if: steps.bootstrap.outputs.required == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/bootstrap_dataset.py

      - name: Commit generated repository
        if: steps.bootstrap.outputs.required == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: bootstrap from dataset template"
          git push origin HEAD:main

      - name: Register dataset in parent pull request
        if: steps.bootstrap.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.PARENT_REPO_PAT }}
          DATASET_REPOSITORY: ${{ github.repository }}
          DATASET_NAME: ${{ github.event.repository.name }}
        run: |
          gh auth setup-git
          gh repo clone "$PARENT_REPOSITORY" parent
          cd parent
          if [ -e "datasets/$DATASET_NAME" ] || git config -f .gitmodules --get-regexp "^submodule\\..*\\.path$" 2>/dev/null | grep -Fq "datasets/$DATASET_NAME"; then
            echo "::notice::Dataset is already registered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "add/$DATASET_NAME"
          git submodule add "https://github.com/$DATASET_REPOSITORY.git" "datasets/$DATASET_NAME"
          python scripts/render_catalog.py
          git add .gitmodules README.md "datasets/$DATASET_NAME"
          git commit -m "Add $DATASET_NAME dataset"
          git push --set-upstream origin "add/$DATASET_NAME"
          gh pr create \
            --repo "$PARENT_REPOSITORY" \
            --base main \
            --head "add/$DATASET_NAME" \
            --title "Add $DATASET_NAME dataset" \
            --body "Automated registration of [$DATASET_REPOSITORY](https://github.com/$DATASET_REPOSITORY) as a submodule."
